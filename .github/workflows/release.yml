name: release

on:
  push:
    tags:
      - 'v*'

# GITHUB_TOKEN needs write to create the GitHub Release that the Terraform
# Registry ingests. Organization defaults may be read-only, so state it here.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # GPG_PRIVATE_KEY and PASSPHRASE live in the 'release' environment, so
    # they are only exposed to jobs that declare it. Environment protection
    # rules (tag patterns, required reviewers) apply to every release.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
