name: release

# Releases are started by hand from main: Actions -> release -> Run workflow,
# or `gh workflow run release.yml -f version=vX.Y.Z`. The job creates the tag
# itself, so the run's ref is refs/heads/main -- which is what the 'release'
# environment's deployment policy allows. A tag pushed by hand does not start
# a build.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v1.5.0 (must match CHANGELOG)'
        required: true
        type: string

# GITHUB_TOKEN creates the tag and the GitHub Release that the Terraform
# Registry ingests. Organization defaults may be read-only, so state it here.
permissions:
  contents: write

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # Only ever release what is on main.
    if: github.ref == 'refs/heads/main'
    # GPG_PRIVATE_KEY and PASSPHRASE live in the 'release' environment, so
    # they are only exposed to jobs that declare it. Its required-reviewers
    # rule pauses every release for an approval.
    environment: release
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version must look like v1.2.3 or v1.2.3-rc.1, got '$VERSION'"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::tag $VERSION already exists on origin"
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
